management:
  endpoints:
    web:
      base-path: /manage
  server:
    port: 8083
org:
  springframework:
    data:
      jpa:
        repository:
          level: FINE
logging:
  level:
    org.hibernate.SQL: ERROR
    root: INFO
spring:
  properties:
    hibernate:
      dialect: org.hibernate.dialect.MySQL8Dialect
  hibernate:
    ddl-auto: update
    show-sql: true
  generate-ddl: true
  banner:
    location: classpath:banner.txt

  user:
    datasource:
      jdbcUrl: jdbc:h2:mem:testdb
      password: password
      username: sa
      driver-class-name: org.h2.Driver

jasypt:
  encryptor:
    password: rXzpBMH4EkKQMYAhalGMik8+Jz51Njb4OVYrSj8iIKSKrA==
server:
  port: 9090
api:
  backed:
    url: http://localhost:9191/api/v1/producer/getMessage
  admin:
    id: e1482313-aea9-4029-9214-505fce95e8bf

resilience4j:
  circuitbreaker:
    instances:
      serviceA:
        registerHealthIndicator: true
        eventConsumerBufferSize: 10
        failureRateThreshold: 50
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        slidingWindowType: COUNT_BASED
  retry:
    instances:
      serviceA:
        registerHealthIndicator: true
        maxRetryAttempts: 5
        waitDuration: 10s
  ratelimiter:
    instances:
      serviceA:
        registerHealthIndicator: false
        limitForPeriod: 10
        limitRefreshPeriod: 10s
        timeoutDuration: 3s